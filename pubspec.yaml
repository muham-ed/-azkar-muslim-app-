name: azkar_muslim
description: "Azkar, prayer times (offline), Qibla compass, Quran audio and tasbeeh."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # موجودة من قبل
  provider: ^6.1.1
  vibration: ^3.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  http: ^1.1.0

  # الجديدة (كانت ناقصة فعلاً)
  adhan_dart: ^2.0.1                   # حساب المواقيت محلياً بدون إنترنت
  geolocator: ^13.0.2                  # GPS
  flutter_compass: ^0.8.1              # حساس البوصلة للقبلة
  audioplayers: ^6.1.0                 # تشغيل التلاوات
  flutter_local_notifications: ^18.0.1 # ثبّت على 18.x: الـ API يتغير بين الإصدارات
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/azkar.json
